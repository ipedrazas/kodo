name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task tidy
      - run: task operator:generate:check
      - run: task test
      - run: task build

  # A three-node celld fleet on kind with SeaweedFS: one pod is force-killed
  # under write load and the job fails if an acknowledged write was lost.
  fleet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-celld
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - run: task spike:kind:up
      - run: task spike:kill-test
      - name: Collect diagnostics
        if: failure()
        run: |
          mkdir -p spike/celld/results/ci
          kubectl -n kodo-spike get pods -o wide > spike/celld/results/ci/pods.txt 2>&1 || true
          for p in celld-0 celld-1 celld-2; do
            kubectl -n kodo-spike logs "$p" --tail=500 > "spike/celld/results/ci/$p.log" 2>&1 || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fleet-results
          path: spike/celld/results/ci/

  # Kernel typecheck and tests under celld dev.
  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: ./.github/actions/setup-celld
      - run: task kernel:check

  # The kernel on a three-node fleet on kind, checked end to end.
  kernel-kind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-celld
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - run: task kernel:up TARGET=kind
      - name: Collect diagnostics
        if: failure()
        run: |
          kubectl --context kind-kodo -n kodo get pods -o wide || true
          for p in celld-0 celld-1 celld-2; do
            kubectl --context kind-kodo -n kodo logs "$p" --tail=200 || true
          done

  # The operator end to end on kind: Fleet, Blueprint and Workspace, a kernel
  # rollout under load, a celld image change, and deleting the Fleet.
  operator-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - run: task operator:e2e:kind
      - name: Collect diagnostics
        if: failure()
        run: |
          kubectl --context kind-kodo -n kodo-e2e get fleet,blueprint,workspace,sts,pods,jobs -o wide || true
          kubectl --context kind-kodo -n kodo-e2e get fleet kodo -o yaml || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operator-e2e
          path: test/e2e/results/
