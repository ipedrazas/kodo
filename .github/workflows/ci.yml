name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task tidy
      - run: task test
      - run: task build

  # A three-node celld fleet on kind with SeaweedFS: one pod is force-killed
  # under write load and the job fails if an acknowledged write was lost.
  fleet:
    runs-on: ubuntu-latest
    env:
      CELLD_VERSION: v0.6.0
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - name: Install celld and esbuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$CELLD_VERSION" -R denoland/celld -p 'celld-x86_64-unknown-linux-gnu.gz' -O - |
            gunzip > /usr/local/bin/celld
          chmod +x /usr/local/bin/celld
          celld --version
          npm install -g esbuild
      - run: task spike:kind:up
      - run: task spike:kill-test
      - name: Collect diagnostics
        if: failure()
        run: |
          mkdir -p spike/celld/results/ci
          kubectl -n kodo-spike get pods -o wide > spike/celld/results/ci/pods.txt 2>&1 || true
          for p in celld-0 celld-1 celld-2; do
            kubectl -n kodo-spike logs "$p" --tail=500 > "spike/celld/results/ci/$p.log" 2>&1 || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fleet-results
          path: spike/celld/results/ci/
