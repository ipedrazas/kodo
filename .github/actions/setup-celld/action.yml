name: Set up celld
description: Install the celld binary, esbuild and Task.
inputs:
  version:
    description: celld release tag
    default: v0.6.0
runs:
  using: composite
  steps:
    - uses: arduino/setup-task@v2
      with:
        version: 3.x
        repo-token: ${{ github.token }}
    - name: Install celld and esbuild
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        CELLD_VERSION: ${{ inputs.version }}
      run: |
        gh release download "$CELLD_VERSION" -R denoland/celld -p 'celld-x86_64-unknown-linux-gnu.gz' -O - |
          gunzip > /usr/local/bin/celld
        chmod +x /usr/local/bin/celld
        celld --version
        npm install -g esbuild
