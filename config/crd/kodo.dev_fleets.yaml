---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: fleets.kodo.dev
spec:
  group: kodo.dev
  names:
    kind: Fleet
    listKind: FleetList
    plural: fleets
    singular: fleet
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.readyReplicas
      name: Ready
      type: integer
    - jsonPath: .status.celld
      name: Celld
      type: string
    - jsonPath: .status.kernel
      name: Kernel
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Fleet is a set of celld nodes sharing one bucket and running
          the kernel.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: FleetSpec describes a celld fleet running the kodo kernel.
            properties:
              admins:
                description: |-
                  Admins names the platform admins, who administer the fleet through
                  their own login at app.<domain>/admin/: settings, budgets, workspaces,
                  Blueprints, users and the audit log.
                properties:
                  emails:
                    description: |-
                      Emails are platform admins by email, if the IdP has not said the
                      email is unverified.
                    items:
                      type: string
                    type: array
                  group:
                    description: Group is the IdP group whose members are platform
                      admins.
                    type: string
                  groupsClaim:
                    default: groups
                    description: GroupsClaim is the ID token claim that lists the
                      user's groups.
                    type: string
                type: object
              auth:
                description: |-
                  Auth is the OIDC provider whose ID tokens the kernel accepts. Without
                  it only the operator's admin token is accepted.
                properties:
                  audience:
                    description: Audience is the OIDC client id the gateway logs users
                      in with.
                    type: string
                  issuer:
                    description: Issuer is the OIDC issuer URL, e.g. https://auth.example.com.
                    type: string
                  jwksURL:
                    description: |-
                      JWKSURL is where the kernel fetches the issuer's signing keys; it may
                      be an in-cluster URL. Defaults to <issuer>/keys.
                    type: string
                required:
                - audience
                - issuer
                type: object
              bucket:
                description: BucketSpec locates the fleet's bucket and its credentials.
                properties:
                  credentialsSecret:
                    description: |-
                      CredentialsSecret names a Secret in the Fleet's namespace with the keys
                      AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY.
                    type: string
                  endpoint:
                    description: Endpoint of an S3-compatible store; AWS S3 if unset.
                    type: string
                  name:
                    description: Name of the bucket, optionally followed by /prefix.
                    type: string
                  region:
                    description: Region; "auto" for Tigris.
                    type: string
                required:
                - credentialsSecret
                - name
                type: object
              celld:
                description: |-
                  Celld is the celld node image, e.g. ghcr.io/denoland/celld:0.6.0.
                  Changing it stops every node before starting the new version, because
                  mixed celld versions cannot share a fleet.
                type: string
              egress:
                description: |-
                  Egress, when set, denies the nodes every outbound connection except
                  DNS, the fleet's own nodes, the Gatekeeper and the destinations listed
                  in it, such as the bucket endpoint and the identity provider's keys.
                  Models are reached through the Gatekeeper, never directly.
                properties:
                  allow:
                    description: Allow are extra egress rules, in NetworkPolicy form.
                    items:
                      description: |-
                        NetworkPolicyEgressRule describes a particular set of traffic that is allowed out of pods
                        matched by a NetworkPolicySpec's podSelector. The traffic must match both ports and to.
                        This type is beta-level in 1.8
                      properties:
                        ports:
                          description: |-
                            ports is a list of destination ports for outgoing traffic.
                            Each item in this list is combined using a logical OR. If this field is
                            empty or missing, this rule matches all ports (traffic not restricted by port).
                            If this field is present and contains at least one item, then this rule allows
                            traffic only if the traffic matches at least one port in the list.
                          items:
                            description: NetworkPolicyPort describes a port to allow
                              traffic on
                            properties:
                              endPort:
                                description: |-
                                  endPort indicates that the range of ports from port to endPort if set, inclusive,
                                  should be allowed by the policy. This field cannot be defined if the port field
                                  is not defined or if the port field is defined as a named (string) port.
                                  The endPort must be equal or greater than port.
                                format: int32
                                type: integer
                              port:
                                anyOf:
                                - type: integer
                                - type: string
                                description: |-
                                  port represents the port on the given protocol. This can either be a numerical or named
                                  port on a pod. If this field is not provided, this matches all port names and
                                  numbers.
                                  If present, only traffic on the specified protocol AND port will be matched.
                                x-kubernetes-int-or-string: true
                              protocol:
                                description: |-
                                  protocol represents the protocol (TCP, UDP, or SCTP) which traffic must match.
                                  If not specified, this field defaults to TCP.
                                type: string
                            type: object
                          type: array
                          x-kubernetes-list-type: atomic
                        to:
                          description: |-
                            to is a list of destinations for outgoing traffic of pods selected for this rule.
                            Items in this list are combined using a logical OR operation. If this field is
                            empty or missing, this rule matches all destinations (traffic not restricted by
                            destination). If this field is present and contains at least one item, this rule
                            allows traffic only if the traffic matches at least one item in the to list.
                          items:
                            description: |-
                              NetworkPolicyPeer describes a peer to allow traffic to/from. Only certain combinations of
                              fields are allowed
                            properties:
                              ipBlock:
                                description: |-
                                  ipBlock defines policy on a particular IPBlock. If this field is set then
                                  neither of the other fields can be.
                                properties:
                                  cidr:
                                    description: |-
                                      cidr is a string representing the IPBlock
                                      Valid examples are "192.168.1.0/24" or "2001:db8::/64"
                                    type: string
                                  except:
                                    description: |-
                                      except is a slice of CIDRs that should not be included within an IPBlock
                                      Valid examples are "192.168.1.0/24" or "2001:db8::/64"
                                      Except values will be rejected if they are outside the cidr range
                                    items:
                                      type: string
                                    type: array
                                    x-kubernetes-list-type: atomic
                                required:
                                - cidr
                                type: object
                              namespaceSelector:
                                description: |-
                                  namespaceSelector selects namespaces using cluster-scoped labels. This field follows
                                  standard label selector semantics; if present but empty, it selects all namespaces.

                                  If podSelector is also set, then the NetworkPolicyPeer as a whole selects
                                  the pods matching podSelector in the namespaces selected by namespaceSelector.
                                  Otherwise it selects all pods in the namespaces selected by namespaceSelector.
                                properties:
                                  matchExpressions:
                                    description: matchExpressions is a list of label
                                      selector requirements. The requirements are
                                      ANDed.
                                    items:
                                      description: |-
                                        A label selector requirement is a selector that contains values, a key, and an operator that
                                        relates the key and values.
                                      properties:
                                        key:
                                          description: key is the label key that the
                                            selector applies to.
                                          type: string
                                        operator:
                                          description: |-
                                            operator represents a key's relationship to a set of values.
                                            Valid operators are In, NotIn, Exists and DoesNotExist.
                                          type: string
                                        values:
                                          description: |-
                                            values is an array of string values. If the operator is In or NotIn,
                                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                            the values array must be empty. This array is replaced during a strategic
                                            merge patch.
                                          items:
                                            type: string
                                          type: array
                                          x-kubernetes-list-type: atomic
                                      required:
                                      - key
                                      - operator
                                      type: object
                                    type: array
                                    x-kubernetes-list-type: atomic
                                  matchLabels:
                                    additionalProperties:
                                      type: string
                                    description: |-
                                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                                    type: object
                                type: object
                                x-kubernetes-map-type: atomic
                              podSelector:
                                description: |-
                                  podSelector is a label selector which selects pods. This field follows standard label
                                  selector semantics; if present but empty, it selects all pods.

                                  If namespaceSelector is also set, then the NetworkPolicyPeer as a whole selects
                                  the pods matching podSelector in the Namespaces selected by NamespaceSelector.
                                  Otherwise it selects the pods matching podSelector in the policy's own namespace.
                                properties:
                                  matchExpressions:
                                    description: matchExpressions is a list of label
                                      selector requirements. The requirements are
                                      ANDed.
                                    items:
                                      description: |-
                                        A label selector requirement is a selector that contains values, a key, and an operator that
                                        relates the key and values.
                                      properties:
                                        key:
                                          description: key is the label key that the
                                            selector applies to.
                                          type: string
                                        operator:
                                          description: |-
                                            operator represents a key's relationship to a set of values.
                                            Valid operators are In, NotIn, Exists and DoesNotExist.
                                          type: string
                                        values:
                                          description: |-
                                            values is an array of string values. If the operator is In or NotIn,
                                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                            the values array must be empty. This array is replaced during a strategic
                                            merge patch.
                                          items:
                                            type: string
                                          type: array
                                          x-kubernetes-list-type: atomic
                                      required:
                                      - key
                                      - operator
                                      type: object
                                    type: array
                                    x-kubernetes-list-type: atomic
                                  matchLabels:
                                    additionalProperties:
                                      type: string
                                    description: |-
                                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                                    type: object
                                type: object
                                x-kubernetes-map-type: atomic
                            type: object
                          type: array
                          x-kubernetes-list-type: atomic
                      type: object
                    type: array
                  proxy:
                    description: |-
                      Proxy sends the nodes' HTTPS traffic, which is their bucket traffic,
                      through the Gatekeeper's egress proxy, which tunnels only to the hosts
                      it allows. Use it when the bucket endpoint has no fixed addresses to
                      allow. Needs gatekeeper.
                    type: boolean
                type: object
              gatekeeper:
                description: |-
                  Gatekeeper connects the kernel to a Gatekeeper, which makes the external
                  calls gadgets are granted. The operator gives the fleet a signing key
                  and adds it to the Gatekeeper's trusted fleets. Without it, capability
                  calls fail.
                properties:
                  namespace:
                    default: kodo-system
                    description: Namespace the Gatekeeper runs in.
                    type: string
                  service:
                    default: kodo-gatekeeper
                    description: Service is the Gatekeeper's Service; its internal
                      port is 8081.
                    type: string
                  trustSecret:
                    default: kodo-gatekeeper-fleets
                    description: |-
                      TrustSecret is the Secret in Namespace that holds one key per trusted
                      fleet, mounted into the Gatekeeper.
                    type: string
                type: object
              idleEvictSeconds:
                default: 30
                description: IdleEvictSeconds hibernates a cell after this long without
                  work.
                format: int32
                type: integer
              inference:
                description: |-
                  Inference locates the inference gateway's configuration, which the
                  operator reports to the kernel each minute so the admin dashboard
                  shows the models, their backends and the rate limits as configured.
                properties:
                  namespace:
                    default: kodo-inference
                    description: Namespace of the AIGatewayRoutes and BackendTrafficPolicies.
                    type: string
                type: object
              kernel:
                description: |-
                  Kernel is the kernel image. The operator runs it as a Job that deploys
                  the kernel to the bucket; nodes adopt it without restarting.
                type: string
              replicas:
                default: 3
                description: Replicas is the number of celld nodes. Two or more make
                  writes fast.
                format: int32
                minimum: 1
                type: integer
              resources:
                description: Resources for each node.
                properties:
                  claims:
                    description: |-
                      Claims lists the names of resources, defined in spec.resourceClaims,
                      that are used by this container.

                      This field depends on the
                      DynamicResourceAllocation feature gate.

                      This field is immutable. It can only be set for containers.
                    items:
                      description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                      properties:
                        name:
                          description: |-
                            Name must match the name of one entry in pod.spec.resourceClaims of
                            the Pod where this field is used. It makes that resource available
                            inside a container.
                          type: string
                        request:
                          description: |-
                            Request is the name chosen for a request in the referenced claim.
                            If empty, everything from the claim is made available, otherwise
                            only the result of this request.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  limits:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Limits describes the maximum amount of compute resources allowed.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                  requests:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Requests describes the minimum amount of compute resources required.
                      If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                      otherwise to an implementation-defined value. Requests cannot exceed Limits.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                type: object
              runtimeClassName:
                description: RuntimeClassName for the nodes, e.g. gvisor.
                type: string
              storageClassName:
                description: StorageClassName for the node volumes; the cluster default
                  if unset.
                type: string
              storageSize:
                anyOf:
                - type: integer
                - type: string
                default: 2Gi
                description: StorageSize of each node's local volume, a cache of the
                  bucket.
                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                x-kubernetes-int-or-string: true
            required:
            - bucket
            - celld
            - kernel
            type: object
          status:
            description: FleetStatus reports what the operator has rolled out.
            properties:
              celld:
                description: Celld is the node image currently running.
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              kernel:
                description: Kernel is the kernel image last deployed successfully.
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation this status describes.
                format: int64
                type: integer
              readyReplicas:
                description: ReadyReplicas is the number of ready nodes.
                format: int32
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
