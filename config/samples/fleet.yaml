# A three-node fleet on Tigris under gVisor. The Secret "bucket" holds
# AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY.
apiVersion: kodo.dev/v1alpha1
kind: Fleet
metadata:
  name: kodo
spec:
  celld: ghcr.io/denoland/celld:0.6.0
  kernel: ghcr.io/ipedrazas/kodo-kernel:main
  replicas: 3
  runtimeClassName: gvisor
  bucket:
    name: kodo-dev
    endpoint: https://t3.storage.dev
    region: auto
    credentialsSecret: bucket
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi
