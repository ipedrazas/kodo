apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kodo-operator-leader-election
  namespace: kodo-system
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kodo-operator-leader-election
  namespace: kodo-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kodo-operator-leader-election
subjects:
  - kind: ServiceAccount
    name: kodo-operator
    namespace: kodo-system
