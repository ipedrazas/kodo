# Chat as Blueprint chat 1.0.0 on the fleet "kodo":
#   kubectl -n kodo apply -k examples/chat
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - blueprint.yaml
configMapGenerator:
  - name: chat
    files:
      - gadget.js
generatorOptions:
  # The Blueprint names the ConfigMap; a version's source never changes.
  disableNameSuffixHash: true
