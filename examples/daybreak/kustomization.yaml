# daybreak as Blueprint daybreak 1.0.2 on the fleet "kodo":
#   kubectl -n kodo apply -k examples/daybreak
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - blueprint.yaml
configMapGenerator:
  - name: daybreak
    files:
      - gadget.js
generatorOptions:
  # The Blueprint names the ConfigMap; a version's source never changes.
  disableNameSuffixHash: true
