version: "3"

dotenv: [".env"]

vars:
  MODULE: github.com/ipedrazas/kodo
  KIND_CLUSTER: kodo
  SPIKE_BUCKET: kodo-celld-spike
  SPIKE_NS: kodo-spike
  K3S_CONTEXT: default
  TARGET: kind
  CONTEXT: '{{if eq .TARGET "kind"}}kind-{{.KIND_CLUSTER}}{{else}}{{.K3S_CONTEXT}}{{end}}'
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo none
  LDFLAGS: >-
    -X {{.MODULE}}/internal/version.version={{.VERSION}}
    -X {{.MODULE}}/internal/version.commit={{.COMMIT}}

tasks:
  default:
    desc: List available tasks
    silent: true
    cmds:
      - task --list

  fmt:
    desc: Format Go code
    cmds:
      - golangci-lint fmt

  lint:
    desc: Run linters
    cmds:
      - golangci-lint run

  test:
    desc: Run unit tests with the race detector
    cmds:
      - go test -race -coverprofile=coverage.out ./...

  build:
    desc: Build all packages
    cmds:
      - go build -ldflags "{{.LDFLAGS}}" ./...

  tidy:
    desc: Tidy go.mod and fail if it changes
    cmds:
      - go mod tidy -diff

  ci:
    desc: Everything CI runs
    cmds:
      - task: tidy
      - task: operator:generate:check
      - task: lint
      - task: test
      - task: build

  kind:up:
    desc: Create the local kind cluster
    status:
      - kind get clusters | grep -qx {{.KIND_CLUSTER}}
    cmds:
      - kind create cluster --name {{.KIND_CLUSTER}}

  kind:down:
    desc: Delete the local kind cluster
    cmds:
      - kind delete cluster --name {{.KIND_CLUSTER}}

  spike:deploy:
    desc: Deploy the spike app and sample gadget bundles to the spike bucket (needs celld and esbuild)
    cmds:
      - >-
        S3_ENDPOINT=$AWS_ENDPOINT_URL_S3
        spike/celld/scripts/deploy.sh --bucket s3://{{.SPIKE_BUCKET}} --region auto

  spike:up:
    desc: Run the celld spike fleet on the current kubectl context
    cmds:
      - kubectl create namespace {{.SPIKE_NS}} --dry-run=client -o yaml | kubectl apply -f -
      - >-
        kubectl -n {{.SPIKE_NS}} create secret generic celld-bucket --from-env-file=.env
        --dry-run=client -o yaml | kubectl apply -f -
      - kubectl apply -k spike/celld/k8s/k3s
      - kubectl -n {{.SPIKE_NS}} rollout status sts/celld --timeout=300s
      - task: spike:client

  spike:down:
    desc: Delete the celld spike namespace (the bucket is left untouched)
    cmds:
      - kubectl delete namespace {{.SPIKE_NS}}

  spike:client:
    desc: Start the load-generating client pod and copy the spike scripts into it
    cmds:
      - >-
        kubectl -n {{.SPIKE_NS}} get pod client >/dev/null 2>&1 ||
        kubectl -n {{.SPIKE_NS}} run client --image=curlimages/curl:8.16.0 --restart=Never --command -- sleep 604800
      - kubectl -n {{.SPIKE_NS}} wait --for=condition=Ready pod/client --timeout=120s
      - for: [writer.sh, sweep.sh, burst.sh, activate.sh]
        cmd: kubectl -n {{.SPIKE_NS}} cp spike/celld/scripts/{{.ITEM}} client:/tmp/{{.ITEM}}

  spike:kind:up:
    desc: Run the spike fleet on a local kind cluster with SeaweedFS (needs Docker, celld and esbuild)
    cmds:
      - task: kind:up
      - kubectl config use-context kind-{{.KIND_CLUSTER}}
      - kubectl create namespace {{.SPIKE_NS}} --dry-run=client -o yaml | kubectl apply -f -
      - kubectl -n {{.SPIKE_NS}} apply -f spike/celld/k8s/kind/seaweedfs.yaml
      - kubectl -n {{.SPIKE_NS}} rollout status deploy/seaweedfs --timeout=180s
      - task: spike:client
      - >-
        kubectl -n {{.SPIKE_NS}} exec client -- curl -sf -X PUT --aws-sigv4 aws:amz:us-east-1:s3
        --user devkey:devsecret http://seaweedfs:8333/kodo-ci
      - spike/celld/scripts/kind-deploy.sh
      - kubectl apply -k spike/celld/k8s/kind
      - kubectl -n {{.SPIKE_NS}} rollout status sts/celld --timeout=300s

  spike:kill-test:
    desc: Force-kill a celld pod under write load and fail on any lost write
    cmds:
      - mkdir -p spike/celld/results/ci
      - spike/celld/scripts/kill-test.sh spike/celld/results/ci/kill.log {{.SECONDS | default 60}}

  kernel:install:
    desc: Install the kernel's development dependencies
    dir: kernel
    sources: [package.json, package-lock.json]
    cmds:
      - npm ci

  kernel:check:
    desc: Typecheck the kernel and run its tests under celld dev (needs celld and esbuild)
    dir: kernel
    deps: [kernel:install]
    cmds:
      - npm run typecheck
      - npm test

  fleet:up:
    desc: Start a kodo fleet on TARGET=kind (default, creates the cluster) or TARGET=k3s; nodes become ready once the kernel is deployed
    cmds:
      - task: '{{if eq .TARGET "kind"}}kind:up{{else}}fleet:noop{{end}}'
      - kubectl --context {{.CONTEXT}} create namespace kodo --dry-run=client -o yaml | kubectl --context {{.CONTEXT}} apply -f -
      - task: fleet:bucket:{{.TARGET}}
      - >-
        kubectl --context {{.CONTEXT}} -n kodo get secret kernel-admin >/dev/null 2>&1 ||
        kubectl --context {{.CONTEXT}} -n kodo create secret generic kernel-admin --from-literal=token=$(openssl rand -hex 24)
      - kubectl --context {{.CONTEXT}} apply -k deploy/fleet/{{.TARGET}}

  fleet:wait:
    desc: Wait for every fleet node on TARGET to be ready
    cmds:
      - kubectl --context {{.CONTEXT}} -n kodo rollout status sts/celld --timeout=300s

  fleet:bucket:kind:
    internal: true
    cmds:
      - kubectl --context {{.CONTEXT}} -n kodo apply -f deploy/fleet/kind/seaweedfs.yaml
      - kubectl --context {{.CONTEXT}} -n kodo rollout status deploy/seaweedfs --timeout=180s
      - >-
        kubectl --context {{.CONTEXT}} -n kodo run mkbucket --rm -i --restart=Never
        --image=curlimages/curl:8.16.0 --command -- curl -s -o /dev/null -w '%{http_code}\n'
        -X PUT --aws-sigv4 aws:amz:us-east-1:s3 --user devkey:devsecret http://seaweedfs:8333/kodo-ci

  fleet:bucket:k3s:
    internal: true
    cmds:
      - >-
        kubectl --context {{.CONTEXT}} -n kodo create secret generic celld-bucket --from-env-file=.env
        --dry-run=client -o yaml | kubectl --context {{.CONTEXT}} apply -f -

  fleet:noop:
    internal: true
    cmds: []

  fleet:down:
    desc: Delete the kodo namespace on TARGET (the bucket is left untouched)
    cmds:
      - kubectl --context {{.CONTEXT}} delete namespace kodo

  kernel:deploy:
    desc: Deploy the kernel to the fleet bucket of TARGET (needs celld and esbuild)
    cmds:
      - >-
        KERNEL_ADMIN_TOKEN=$(kubectl --context {{.CONTEXT}} -n kodo get secret kernel-admin -o jsonpath='{.data.token}' | base64 -d)
        deploy/fleet/with-bucket.sh {{.TARGET}} kernel/scripts/deploy.sh

  kernel:smoke:
    desc: Publish the sample gadget on TARGET, create a cell from it and check it works
    cmds:
      - deploy/fleet/smoke.sh {{.CONTEXT}}

  kernel:up:
    desc: Fleet, kernel and smoke test on TARGET in one go
    cmds:
      - task: fleet:up
      - task: kernel:deploy
      - task: fleet:wait
      - task: kernel:smoke

  api:
    desc: Call the kernel API on TARGET from inside the cluster (METHOD=GET ROUTE=/blueprints BODY='json' or BODY=@file)
    cmds:
      - deploy/fleet/api.sh {{.CONTEXT}} {{.METHOD | default "GET"}} {{.ROUTE}} {{if .BODY}}{{shellQuote .BODY}}{{end}}

  operator:generate:
    desc: Regenerate deepcopy code, CRDs and the operator ClusterRole
    cmds:
      - go tool controller-gen object crd rbac:roleName=kodo-operator paths=./... output:crd:artifacts:config=config/crd output:rbac:artifacts:config=config/rbac

  operator:generate:check:
    desc: Fail if generated operator files are out of date
    cmds:
      - task: operator:generate
      - git diff --exit-code -- api/v1alpha1/zz_generated.deepcopy.go config/crd config/rbac/role.yaml

  operator:e2e:kind:
    desc: Run the operator end-to-end test on a kind cluster (needs Docker, kind and Go)
    cmds:
      - test/e2e/kind.sh

  operator:e2e:cluster:
    desc: Run the operator end-to-end test on TARGET=k3s (KERNEL_IMAGE, KERNEL_IMAGE_2, optional OPERATOR_IMAGE)
    env:
      CONTEXT: "{{.CONTEXT}}"
      RUNTIME_CLASS: gvisor
    cmds:
      - test/e2e/cluster.sh

  k3s:up:
    desc: The hiddenfield.dev environment on the k3s cluster (KERNEL_IMAGE and OPERATOR_IMAGE required)
    cmds:
      - kubectl --context {{.K3S_CONTEXT}} apply --server-side -k deploy/platform
      - kubectl --context {{.K3S_CONTEXT}} -n cert-manager rollout status deploy/cert-manager-webhook --timeout=300s
      - kubectl --context {{.K3S_CONTEXT}} -n envoy-gateway-system rollout status deploy/envoy-gateway --timeout=300s
      - >-
        kubectl --context {{.K3S_CONTEXT}} -n cert-manager create secret generic cloudflare-api-token
        --from-literal=token="$CLOUDFLARE_API_TOKEN" --dry-run=client -o yaml | kubectl --context {{.K3S_CONTEXT}} apply -f -
      - sed "s/LETSENCRYPT_EMAIL/$LETSENCRYPT_EMAIL/" deploy/k3s/gateway.yaml | kubectl --context {{.K3S_CONTEXT}} apply -f -
      - deploy/k3s/auth-secrets.sh
      - kubectl --context {{.K3S_CONTEXT}} apply -f deploy/k3s/dex.yaml
      - kubectl --context {{.K3S_CONTEXT}} apply -k config
      - kubectl --context {{.K3S_CONTEXT}} -n kodo-system set image deploy/kodo-operator operator={{.OPERATOR_IMAGE}}
      - >-
        kubectl --context {{.K3S_CONTEXT}} -n kodo create secret generic bucket
        --from-literal=AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" --from-literal=AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY"
        --dry-run=client -o yaml | kubectl --context {{.K3S_CONTEXT}} apply -f -
      - sed "s#KERNEL_IMAGE#{{.KERNEL_IMAGE}}#" deploy/k3s/fleet.yaml | kubectl --context {{.K3S_CONTEXT}} apply -f -
      - kubectl --context {{.K3S_CONTEXT}} apply -f deploy/k3s/routes.yaml
      - kubectl --context {{.K3S_CONTEXT}} -n kodo wait fleet/kodo --for=condition=Ready --timeout=600s

  k3s:identity-test:
    desc: Log in through the hiddenfield.dev gateway as the test users and check identity, TLS and sharing
    cmds:
      - test/e2e/identity.sh
