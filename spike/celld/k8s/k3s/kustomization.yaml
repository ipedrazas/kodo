# The spike fleet on the k3s cluster: gVisor and the Tigris bucket. The
# celld-bucket Secret is created from .env by `task spike:up`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
configMapGenerator:
  - name: celld-config
    namespace: kodo-spike
    literals:
      - BUCKET=kodo-celld-spike
patches:
  - target:
      kind: StatefulSet
      name: celld
    patch: |-
      - op: add
        path: /spec/template/spec/runtimeClassName
        value: gvisor
