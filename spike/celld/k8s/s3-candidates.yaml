# Self-hosted S3-compatible stores to test with `celld diagnose`, as candidates
# for the in-cluster store in kind and CI. Ephemeral storage only.
apiVersion: v1
kind: Namespace
metadata:
  name: kodo-s3
---
apiVersion: v1
kind: Pod
metadata:
  name: rustfs
  namespace: kodo-s3
  labels: {app: rustfs}
spec:
  containers:
    - name: rustfs
      image: rustfs/rustfs:latest
      env:
        - {name: RUSTFS_ACCESS_KEY, value: devkey}
        - {name: RUSTFS_SECRET_KEY, value: devsecret123}
      ports: [{containerPort: 9000}]
---
apiVersion: v1
kind: Service
metadata: {name: rustfs, namespace: kodo-s3}
spec:
  selector: {app: rustfs}
  ports: [{port: 9000}]
---
apiVersion: v1
kind: Pod
metadata:
  name: seaweedfs
  namespace: kodo-s3
  labels: {app: seaweedfs}
spec:
  containers:
    - name: seaweedfs
      image: chrislusf/seaweedfs:latest
      args: [server, -s3]
      ports: [{containerPort: 8333}]
---
apiVersion: v1
kind: Service
metadata: {name: seaweedfs, namespace: kodo-s3}
spec:
  selector: {app: seaweedfs}
  ports: [{port: 8333}]
