# Single-node SeaweedFS as the in-cluster S3 store for kind and CI. Ephemeral:
# a restart loses the bucket. With no identities configured it accepts any
# credentials.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seaweedfs
  template:
    metadata:
      labels:
        app: seaweedfs
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:3.97
          args: [server, -s3, -dir=/data]
          ports:
            - containerPort: 8333
          readinessProbe:
            tcpSocket:
              port: 8333
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
spec:
  selector:
    app: seaweedfs
  ports:
    - port: 8333
