# An OpenAI-compatible model simulator (llm-d inference-sim) as a second
# backend: it answers chat completions by echoing the prompt and reports
# token usage like a real model, at no cost. Only the inference gateway
# reaches it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sim
  namespace: kodo-inference
  labels:
    app.kubernetes.io/name: sim
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sim
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sim
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sim
          image: ghcr.io/llm-d/llm-d-inference-sim:v0.11.2
          args: [--model, kodo-sim, --port, "8000", --mode, echo]
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: sim
  namespace: kodo-inference
spec:
  selector:
    app.kubernetes.io/name: sim
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sim
  namespace: kodo-inference
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sim
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
          podSelector:
            matchLabels:
              gateway.envoyproxy.io/owning-gateway-name: kodo-inference
      ports:
        - port: 8000
