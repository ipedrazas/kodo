# Rate limits, enforced by the inference gateway on the headers the
# Gatekeeper sets: x-kodo-user (the owner's subject) and x-kodo-workspace
# (<fleet namespace>/<fleet>/<workspace>). A call over a limit is refused
# with 429. Counters live in Redis and reset each period.
#
# Monthly token budgets per user and per workspace are not here: since
# Phase 12 the kernel keeps them, platform admins set them at
# app.<domain>/admin/, and a model call over budget never reaches the
# Gatekeeper. This policy is cluster protection: a ceiling on how fast any
# one user can call models, whatever their budget. The admin dashboard shows
# it as configured, through the operator's cluster report.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: kodo-inference-budgets
  namespace: kodo-inference
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: kodo-inference
  rateLimit:
    type: Global
    global:
      rules:
        # Each user: 60 calls a minute.
        - clientSelectors:
            - headers:
                - name: x-kodo-user
                  type: Distinct
          limit:
            requests: 60
            unit: Minute
          shared: true
