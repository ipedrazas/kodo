# Budgets and rate limits, enforced by the inference gateway on the headers
# the Gatekeeper sets: x-kodo-user (the owner's subject) and x-kodo-workspace
# (<fleet namespace>/<fleet>/<workspace>). A call is let through while every
# rule that matches it has budget left, and what it used (total tokens, from
# the backend's answer) is then taken from each; a call over any of them is
# refused with 429. Counters live in Redis and reset each period; changing
# the rules can reset them too. A rule for one user or workspace (an Exact
# header match) adds a limit, so it can only lower the default.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: kodo-inference-budgets
  namespace: kodo-inference
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: kodo-inference
  rateLimit:
    type: Global
    global:
      rules:
        # Each user: 1M tokens a month.
        - clientSelectors:
            - headers:
                - name: x-kodo-user
                  type: Distinct
          limit:
            requests: 1000000
            unit: Month
          shared: true
          cost:
            request:
              from: Number
              number: 0
            response:
              from: Metadata
              metadata:
                namespace: io.envoy.ai_gateway
                key: llm_total_token
        # Each workspace: 5M tokens a month.
        - clientSelectors:
            - headers:
                - name: x-kodo-workspace
                  type: Distinct
          limit:
            requests: 5000000
            unit: Month
          shared: true
          cost:
            request:
              from: Number
              number: 0
            response:
              from: Metadata
              metadata:
                namespace: io.envoy.ai_gateway
                key: llm_total_token
        # Each user: 60 calls a minute.
        - clientSelectors:
            - headers:
                - name: x-kodo-user
                  type: Distinct
          limit:
            requests: 60
            unit: Minute
          shared: true
