# Cluster prerequisites: cert-manager and Envoy Gateway (with the Gateway API
# CRDs), with Envoy Gateway configured for the inference gateway (the Envoy
# AI Gateway extension and Redis-backed rate limits). Apply server-side, the
# CRDs are too large for client-side apply:
#   kubectl apply --server-side -k deploy/platform
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/cert-manager/cert-manager/releases/download/v1.21.2/cert-manager.yaml
  - https://github.com/envoyproxy/gateway/releases/download/v1.9.2/install.yaml
  - redis.yaml
patches:
  - path: envoy-gateway-config.yaml
