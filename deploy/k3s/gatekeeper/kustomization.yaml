# The Gatekeeper for hiddenfield.dev: its own Tigris bucket, Dex for users,
# an egress proxy that lets fleets reach only Tigris, and the inference
# gateway. task k3s:gatekeeper creates the Secrets kodo-gatekeeper-bucket
# (from .buckets.env) and kodo-gatekeeper-openbao (from .env) before applying
# this; task k3s:inference creates kodo-gatekeeper-inference.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kodo-system
resources:
  - ../../../config/gatekeeper
configMapGenerator:
  - name: kodo-gatekeeper
    literals:
      - GATEKEEPER_BUCKET=kodo-dev-gatekeeper
      - S3_ENDPOINT=https://t3.storage.dev
      - AWS_REGION=auto
      - OIDC_ISSUER=https://auth.hiddenfield.dev
      - OIDC_AUDIENCE=kodo
      - OIDC_JWKS_URL=http://dex.kodo-auth.svc:5556/keys
      # Tigris answers on t3.storage.dev and on <bucket>.t3.storage.dev.
      - GATEKEEPER_EGRESS_ALLOW=t3.storage.dev:443,*.t3.storage.dev:443
      # deploy/inference; task k3s:inference.
      - INFERENCE_URL=http://kodo-inference.envoy-gateway-system.svc
      # Public APIs gadgets may read (examples/hn-reader).
      - GATEKEEPER_WEB_ALLOW=hn.algolia.com
