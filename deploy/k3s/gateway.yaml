# The edge for hiddenfield.dev on the LAN: one Envoy Gateway listener set on
# a fixed MetalLB address, TLS from cert-manager (Let's Encrypt, Cloudflare
# DNS-01). app, auth and every cell hostname share one certificate.
apiVersion: v1
kind: Namespace
metadata:
  name: kodo-gateway
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eg
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: kodo
  namespace: kodo-gateway
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        annotations:
          # Outside the node addresses (.221-.223) that the MetalLB pool overlaps.
          metallb.universe.tf/loadBalancerIPs: 192.168.2.224
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: LETSENCRYPT_EMAIL
    privateKeySecretRef:
      name: letsencrypt-account
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: token
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: hiddenfield
  namespace: kodo-gateway
spec:
  secretName: hiddenfield-tls
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt
  dnsNames:
    - app.hiddenfield.dev
    - auth.hiddenfield.dev
    - "*.g.hiddenfield.dev"
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: kodo
  namespace: kodo-gateway
spec:
  gatewayClassName: eg
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: kodo
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.hiddenfield.dev"
      tls:
        certificateRefs:
          - name: hiddenfield-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: https-cells
      protocol: HTTPS
      port: 443
      hostname: "*.g.hiddenfield.dev"
      tls:
        certificateRefs:
          - name: hiddenfield-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
# Plain HTTP only redirects to HTTPS.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: kodo-gateway
spec:
  parentRefs:
    - name: kodo
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
