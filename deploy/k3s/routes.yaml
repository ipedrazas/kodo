# app.hiddenfield.dev (the API) and every cell hostname go to the kodo fleet,
# and app.hiddenfield.dev/gatekeeper/ to the Gatekeeper, behind an OIDC login. One session cookie on .hiddenfield.dev covers the app
# and every cell; the gateway forwards the ID token to the kernel in
# x-kodo-identity, and the kernel verifies it and strips it, and the session
# cookies, before anything reaches a gadget.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kodo
  namespace: kodo
spec:
  parentRefs:
    - name: kodo
      namespace: kodo-gateway
      sectionName: https
    - name: kodo
      namespace: kodo-gateway
      sectionName: https-cells
  hostnames:
    - app.hiddenfield.dev
    - "*.g.hiddenfield.dev"
  rules:
    - backendRefs:
        - name: kodo
          port: 80
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: kodo-login
  namespace: kodo
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: kodo
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: kodo-gatekeeper
  oidc:
    provider:
      issuer: https://auth.hiddenfield.dev
    clientID: kodo
    clientSecret:
      # The key must be client-secret.
      name: oidc-client
    scopes: [openid, email, profile, offline_access]
    redirectURL: https://app.hiddenfield.dev/oauth2/callback
    logoutPath: /logout
    cookieDomain: hiddenfield.dev
    cookieNames:
      idToken: kodo-id
      accessToken: kodo-access
    forwardIDToken:
      header: x-kodo-identity
    refreshToken: true
---
# The Gatekeeper's page and API, where users connect accounts. Only on the
# app host: on a cell host a gadget's own page would share its origin.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kodo-gatekeeper
  namespace: kodo
spec:
  parentRefs:
    - name: kodo
      namespace: kodo-gateway
      sectionName: https
  hostnames:
    - app.hiddenfield.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /gatekeeper/
      backendRefs:
        - name: kodo-gatekeeper
          namespace: kodo-system
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: kodo-routes
  namespace: kodo-system
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: kodo
  to:
    - group: ""
      kind: Service
      name: kodo-gatekeeper
