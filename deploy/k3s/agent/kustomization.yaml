# The agent for hiddenfield.dev: the chat at app.hiddenfield.dev/chat/,
# calling the kodo fleet's kernel, thinking with the model "agent" (deploy/
# inference/models.yaml). task k3s:agent applies it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kodo-system
resources:
  - ../../../config/agent
configMapGenerator:
  - name: kodo-agent
    literals:
      - KERNEL_URL=http://kodo.kodo.svc
      - AGENT_MODEL=agent
