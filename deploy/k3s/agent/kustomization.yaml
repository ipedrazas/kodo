# The agent for hiddenfield.dev: the chat at app.hiddenfield.dev/chat/,
# calling the kodo fleet's kernel. Which model it thinks with (by default
# "agent", deploy/inference/models.yaml) and its limits are set at
# app.hiddenfield.dev/admin/. task k3s:agent applies it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kodo-system
resources:
  - ../../../config/agent
configMapGenerator:
  - name: kodo-agent
    literals:
      - KERNEL_URL=http://kodo.kodo.svc
