# The kodo fleet on the k3s cluster, managed by the operator: Tigris bucket
# kodo-dev, gVisor, identity from the in-cluster Dex, the Gatekeeper, and
# default-deny egress. The Secret "bucket" holds AWS_ACCESS_KEY_ID and
# AWS_SECRET_ACCESS_KEY for a key that can reach only kodo-dev (task k3s:up
# creates it from .buckets.env).
apiVersion: kodo.dev/v1alpha1
kind: Fleet
metadata:
  name: kodo
  namespace: kodo
spec:
  celld: ghcr.io/denoland/celld:0.6.1
  kernel: KERNEL_IMAGE
  replicas: 3
  runtimeClassName: gvisor
  bucket:
    name: kodo-dev
    endpoint: https://t3.storage.dev
    region: auto
    credentialsSecret: bucket
  auth:
    issuer: https://auth.hiddenfield.dev
    audience: kodo
    # Fetched from inside the cluster, not through the gateway.
    jwksURL: http://dex.kodo-auth.svc:5556/keys
  # Platform admins, at app.hiddenfield.dev/admin/. Dex's static users have
  # no groups, so by email.
  admins:
    emails: [carol@hiddenfield.dev]
  # The inference gateway's models and rate limits, which the operator
  # reports to the kernel for the dashboard.
  inference: {}
  # Capability calls go to the Gatekeeper in kodo-system.
  gatekeeper: {}
  # Default-deny egress: DNS, the fleet's own nodes and the Gatekeeper, which
  # proxies HTTPS to Tigris and nothing else, plus Dex's signing keys.
  egress:
    proxy: true
    allow:
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: kodo-auth
            podSelector:
              matchLabels:
                app: dex
        ports:
          - port: 5556
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi
