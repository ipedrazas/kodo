# The fleet on kind, backed by SeaweedFS in the same namespace.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kodo
resources:
  - ../base
  - seaweedfs.yaml
configMapGenerator:
  - name: celld-config
    literals:
      - BUCKET=kodo-ci
secretGenerator:
  - name: celld-bucket
    literals:
      - AWS_ACCESS_KEY_ID=devkey
      - AWS_SECRET_ACCESS_KEY=devsecret
      - AWS_REGION=us-east-1
      - AWS_ENDPOINT_URL_S3=http://seaweedfs:8333
patches:
  - target:
      kind: StatefulSet
      name: celld
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 100m
